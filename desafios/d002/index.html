<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio boas-vindas</title>
    <style>
        body {
            font: normal 18pt Arial;
        }
        button {
            font: normal 14pt Arial;
            padding: 30px;
            
        }
    </style>
</head>
<body>
    <h1>Boas-vindas</h1>
    <button onclick="clicou()">Inicie o desafio</button>
    <script>
        function clicou() {
            var nome = window.prompt('Qual é seu nome?')
            var idade =window.prompt(`Olá, ${nome}! Quantos anos você tem?`)
            window.confirm(`Acabei de conhecer ${nome}, que tem ${idade} anos de idade!`)
        }
    </script>
</body>
</html>

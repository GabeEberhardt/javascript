<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes e Depois</title>
    <style>
        body {
            font: normal 18pt Arial;
        }

        button {
            font: normal 12pt Arial;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>Antes e Depois</h1>
    <button onclick="mostrar()">Antecessor e Sucessor</button>
    <script>
        function mostrar() {
            let num = parseInt(prompt('Digite um número inteiro qualquer'))
            let antecessor = num - 1;
            let sucessor = num + 1;
            alert(`Antes de ${num}, temos o número ${antecessor}. \nDepois de ${num}, temos o número ${sucessor}.`);
        }
    </script>
</body>
</html>

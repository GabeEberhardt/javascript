<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sistema de Nacionalidades</h1>
    <input type="text" name="txtnac" id="txtnac"> Nacionalidade
    <input type="button" value="verificar" onclick="checar()">
    <div id="res">

    </div>
    <script>
        function checar() {
            var txtnac = window.document.querySelector('input#txtnac')
            var res = window.document.querySelector('div#res')

            if (txtnac.value.trim().toLowerCase() == 'brasil') {
                res.innerHTML = 'Você é Brasileiro!'
            } else {
                res.innerHTML = 'Você é Estrangeiro!'
            }
        }
    </script>
</body>
</html>
